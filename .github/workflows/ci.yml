name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      # fs-ext (Linux flock binding for the local task store) is a native module built by node-gyp.
      - name: Install native build prerequisites
        timeout-minutes: 5
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential python3
      - run: pnpm install --frozen-lockfile
      # Format check, build (workspace packages export types from dist/), lint, typecheck: one documented order.
      - run: pnpm verify
      # Local infrastructure with dummy development values only; no secrets or cloud credentials are used.
      - name: Start Postgres and Temporal dev server
        run: |
          cp .env.example .env
          pnpm infra:up
          pnpm db:migrate
      # One run executes the unit tests AND the live integration tests with coverage (80% lines/branches floor).
      - run: pnpm test:coverage
      - run: pnpm smoke
      - name: Infrastructure logs on failure
        if: failure()
        run: docker compose --project-directory . -f infra/compose.yaml logs --no-color --tail=200
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: |
            coverage/lcov.info
            coverage/coverage-summary.json
          if-no-files-found: ignore
