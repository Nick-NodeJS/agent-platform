name: agent-platform

services:
  postgres:
    image: postgres:16.15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-platform}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-platform_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-platform}
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5433}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 3s
      retries: 20

  # DEVELOPMENT ONLY. The Temporal dev server keeps its own SQLite file, separate from the
  # application Postgres above. Do not use this setup in production.
  temporal:
    image: temporalio/temporal:1.9.1
    restart: unless-stopped
    command:
      - server
      - start-dev
      - --ip
      - 0.0.0.0
      - --ui-ip
      - 0.0.0.0
      - --port
      - '7233'
      - --ui-port
      - '8233'
      - --db-filename
      - /home/temporal/temporal.db
    ports:
      - '127.0.0.1:7233:7233'
      - '127.0.0.1:8233:8233'
    volumes:
      - temporal-data:/home/temporal
    healthcheck:
      test: ['CMD', 'temporal', 'operator', 'cluster', 'health', '--address', '127.0.0.1:7233']
      interval: 5s
      timeout: 5s
      retries: 30

  # OpenHands Agent Server is intentionally NOT defined here yet; see docs/architecture.md
  # ("OpenHands: deferred setup task"). No Docker socket is mounted into any service.

volumes:
  postgres-data:
  temporal-data:
